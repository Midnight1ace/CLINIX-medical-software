version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=patient_records
      - JWT_SECRET_KEY=dev-secret-key
    depends_on:
      - postgres
    volumes:
      - .:/app
    networks:
      - patient-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=patient_records
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - patient-network

volumes:
  postgres_data:

networks:
  patient-network:
    driver: bridge
