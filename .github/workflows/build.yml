name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Build backend Docker image
        run: |
          docker build -t apri-backend:latest backend/docker/
      
      - name: Tag image
        run: |
          docker tag apri-backend:latest apri-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build
        run: |
          cd frontend
          npm run build
      
      - name: Upload dist
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: frontend/dist
