services:
  - type: web
    name: ai-patient-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main_aiohttp.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_PORT
        value: 8000
      - key: CORS_ORIGIN
        scope: shared
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: web
    name: ai-patient-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-patient-backend
          property: url
    autoDeploy: true
    routes:
      - type: redirect
        source: /
        destination: /
      - type: rewrite
        source: /*
        destination: /index.html
