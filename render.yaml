services:
  - type: web
    name: ai-patient-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main_aiohttp.py
    envVars:
      - key: ENVIRONMENT
        value: production
    autoDeploy: true

  - type: web
    name: ai-patient-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-patient-backend
          property: hostport
          envVarKey: VITE_API_URL
    autoDeploy: true
